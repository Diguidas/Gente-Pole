org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider
android.useAndroidX=true
# Evita o handshake do daemon do Gradle via loopback (127.0.0.1) — nesta
# máquina algo (antivírus/firewall corporativo) bloqueia essa conexão
# local, causando "Unable to establish loopback connection" no build.
org.gradle.daemon=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
