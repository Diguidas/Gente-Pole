workflows:
  ios-ipa-sideload:
    name: iOS IPA para Sideload
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        script: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -1)
          mkdir -p output/Payload
          cp -r "$APP_PATH" output/Payload/
          cd output
          zip -r "../gentepole.ipa" Payload
          cd ..
          echo "IPA criado em: $(pwd)/gentepole.ipa"

    artifacts:
      - gentepole.ipa

  ios-app-store:
    name: iOS App Store (TestFlight)
    max_build_duration: 60
    integrations:
      app_store_connect: Gente Pole Apple   # nome da integracao criada no Codemagic (Team > Integrations)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6834205784
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.polealimentos.gentepole
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA assinado
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
