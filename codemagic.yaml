workflows:
  ios-ipa-sideload:
    name: iOS IPA para Sideload
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        script: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -1)
          mkdir -p output/Payload
          cp -r "$APP_PATH" output/Payload/
          cd output
          zip -r "../gentepole.ipa" Payload
          cd ..
          echo "IPA criado em: $(pwd)/gentepole.ipa"

    artifacts:
      - gentepole.ipa
